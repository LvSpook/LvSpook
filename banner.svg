<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="LvSpook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d0a"/>
      <stop offset="55%" stop-color="#0c1710"/>
      <stop offset="100%" stop-color="#081410"/>
    </linearGradient>
    <linearGradient id="ghostFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eafff2" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#9fe8bd" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9f5cd"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d250" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d250" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d250" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.11" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#00d250" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#00d250" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tiny" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#00d250" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 70h1200M0 140h1200M0 210h1200"/>
    <path d="M150 0v280M300 0v280M450 0v280M600 0v280M750 0v280M900 0v280M1050 0v280"/>
  </g>

  <!-- spectral ghost -->
  <g transform="translate(104 140)">
    <ellipse cx="0" cy="6" rx="66" ry="72" fill="#00f5a0" fill-opacity="0.22" filter="url(#soft)"/>
    <g transform="translate(-50 -56)">
      <path d="M10 90 L10 55 C10 28 28 12 50 12 C72 12 90 28 90 55 L90 90
               C90 96 84 98 80 93 C76 88 70 88 66 93 C62 98 56 98 52 93
               C48 88 42 88 38 93 C34 98 28 98 24 93 C20 88 14 88 10 90 Z"
            fill="url(#ghostFill)"/>
      <ellipse cx="36" cy="52" rx="5.5" ry="6.5" fill="#052016"/>
      <ellipse cx="64" cy="52" rx="5.5" ry="6.5" fill="#052016"/>
      <ellipse cx="36" cy="51" rx="2.2" ry="2.6" fill="#00f5a0" filter="url(#tiny)"/>
      <ellipse cx="64" cy="51" rx="2.2" ry="2.6" fill="#00f5a0" filter="url(#tiny)"/>
      <path d="M42 72 Q50 79 58 72" fill="none" stroke="#052016" stroke-opacity="0.55"
            stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(268 0)">
    <text x="0" y="130"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="70" font-weight="800" fill="url(#textFade)"
          letter-spacing="-1.5">LvSpook</text>
    <text x="4" y="172"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="19" fill="#8fae9c"
          letter-spacing="0.3">Small, careful Windows tools — mostly in Rust</text>
    <g transform="translate(4 204)">
      <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
        <rect x="0" y="-15" width="80" height="27" rx="13.5" fill="#00d250" fill-opacity="0.10" stroke="#00d250" stroke-opacity="0.45"/>
        <text x="40" y="3" text-anchor="middle" fill="#7ff0ae">Rust</text>
        <rect x="92" y="-15" width="104" height="27" rx="13.5" fill="#00d250" fill-opacity="0.10" stroke="#00d250" stroke-opacity="0.45"/>
        <text x="144" y="3" text-anchor="middle" fill="#7ff0ae">Windows</text>
        <rect x="208" y="-15" width="116" height="27" rx="13.5" fill="#00d250" fill-opacity="0.10" stroke="#00d250" stroke-opacity="0.45"/>
        <text x="266" y="3" text-anchor="middle" fill="#7ff0ae">Desktop apps</text>
      </g>
    </g>
  </g>

  <path d="M0 279h1200" stroke="url(#accentLine)" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="none" stroke="#00d250" stroke-opacity="0.14" stroke-width="2"/>
</svg>
