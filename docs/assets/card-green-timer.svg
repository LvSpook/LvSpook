<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 268" width="600" height="268" role="img" aria-label="Green Timer — always-on-top timer overlay for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d09"/>
      <stop offset="55%" stop-color="#0a1610"/>
      <stop offset="100%" stop-color="#040b07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.14" r="0.62">
      <stop offset="0%" stop-color="#00d250" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00d250" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d250"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ff5c0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="band"><rect x="0" y="248" width="600" height="20"/></clipPath>
  </defs>

  <rect width="600" height="268" fill="url(#bg)"/>
  <rect width="600" height="268" fill="url(#glow)"/>

  <g stroke="#00d250" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 67h600M0 134h600M0 201h600"/>
    <path d="M120 0v268M240 0v268M360 0v268M480 0v268"/>
  </g>

  <!-- timer dial -->
  <g transform="translate(504 62)">
    <circle r="58" fill="#00d250" fill-opacity="0.18" filter="url(#soft)"/>
    <circle r="52" fill="none" stroke="#00d250" stroke-opacity="0.16" stroke-width="7"/>
    <circle r="52" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="245 327" transform="rotate(-90)"/>
    <circle r="34" fill="#04120a" stroke="#00d250" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="Consolas, ui-monospace, monospace"
          font-size="17" font-weight="700" fill="#c9f7da">12:30</text>
  </g>

  <text x="34" y="52" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace"
        font-size="9.5" fill="#00d250" fill-opacity="0.55" letter-spacing="2.4">01 // OVERLAY</text>

  <text x="34" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="41" font-weight="800" letter-spacing="-1" fill="url(#name)">Green Timer</text>

  <text x="34" y="142" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="14" fill="#8fae9c">Frameless, always-on-top timer overlay for Windows.</text>
  <text x="34" y="162" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="14" fill="#8fae9c">Count up, count down, Pomodoro or target time.</text>

  <!-- tags -->
  <g transform="translate(34 190)" font-family="Consolas, ui-monospace, monospace"
     font-size="10" letter-spacing="1.4">
    <circle cx="4" cy="-4" r="4" fill="#00d250"/>
    <text x="14" y="0" fill="#9fd8b5">Rust</text>
    <text x="72" y="0" fill="#00f5a0" fill-opacity="0.55">/</text>
    <text x="86" y="0" fill="#9fd8b5">MIT</text>
    <text x="124" y="0" fill="#00f5a0" fill-opacity="0.55">/</text>
    <text x="138" y="0" fill="#9fd8b5">v1.3.0</text>
    <rect x="206" y="-13" width="88" height="20" rx="2" fill="#00d250" fill-opacity="0.1"
          stroke="#00d250" stroke-opacity="0.4"/>
    <text x="250" y="1" text-anchor="middle" fill="#00f5a0" fill-opacity="0.85" font-size="9">WIP</text>
  </g>

  <g clip-path="url(#band)">
    <g fill="#00d250" fill-opacity="0.16">
      <path d="M-24 268 L22 248 H42 L-4 268 Z"/><path d="M46 268 L92 248 H112 L66 268 Z"/>
      <path d="M116 268 L162 248 H182 L136 268 Z"/><path d="M186 268 L232 248 H252 L206 268 Z"/>
      <path d="M256 268 L302 248 H322 L276 268 Z"/><path d="M326 268 L372 248 H392 L346 268 Z"/>
      <path d="M396 268 L442 248 H462 L416 268 Z"/><path d="M466 268 L512 248 H532 L486 268 Z"/>
      <path d="M536 268 L582 248 H602 L556 268 Z"/>
    </g>
  </g>

  <path d="M0 248h600" stroke="#00d250" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="1" y="1" width="598" height="266" fill="none" stroke="#00d250" stroke-opacity="0.28" stroke-width="1.5"/>
  <g stroke="#00d250" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M12 34 L12 12 L34 12"/>
    <path d="M588 34 L588 12 L566 12"/>
  </g>
</svg>
