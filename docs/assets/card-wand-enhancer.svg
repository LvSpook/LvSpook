<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 268" width="600" height="268" role="img" aria-label="Wand Enhancer — UX and interoperability extension for Wand">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0713"/>
      <stop offset="55%" stop-color="#120c22"/>
      <stop offset="100%" stop-color="#080512"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.14" r="0.62">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8c4ff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="band"><rect x="0" y="248" width="600" height="20"/></clipPath>
  </defs>

  <rect width="600" height="268" fill="url(#bg)"/>
  <rect width="600" height="268" fill="url(#glow)"/>

  <g stroke="#a855f7" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 67h600M0 134h600M0 201h600"/>
    <path d="M120 0v268M240 0v268M360 0v268M480 0v268"/>
  </g>

  <!-- wand glyph -->
  <g transform="translate(504 62)">
    <circle r="56" fill="#a855f7" fill-opacity="0.22" filter="url(#soft)"/>
    <g transform="rotate(-35)">
      <rect x="-4" y="-46" width="8" height="70" rx="4" fill="#c9a9ff" fill-opacity="0.9"/>
      <path d="M0 -62 L7 -50 L0 -38 L-7 -50 Z" fill="#e8dbff"/>
    </g>
    <g fill="#d8c4ff">
      <circle cx="-28" cy="-30" r="2.4" fill-opacity="0.85"/>
      <circle cx="30" cy="-16" r="1.8" fill-opacity="0.6"/>
      <circle cx="-18" cy="22" r="2" fill-opacity="0.5"/>
      <circle cx="26" cy="30" r="2.6" fill-opacity="0.7"/>
    </g>
  </g>

  <text x="34" y="52" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace"
        font-size="9.5" fill="#c9a9ff" fill-opacity="0.6" letter-spacing="2.4">02 // EXTENSION</text>

  <text x="34" y="112" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="39" font-weight="800" letter-spacing="-1" fill="url(#name)">Wand Enhancer</text>

  <text x="34" y="142" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="14" fill="#a99cbe">Advanced UX and interoperability extension for Wand.</text>
  <text x="34" y="162" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="14" fill="#a99cbe">Smoothes the rough edges the app leaves behind.</text>

  <g transform="translate(34 190)" font-family="Consolas, ui-monospace, monospace"
     font-size="10" letter-spacing="1.4">
    <circle cx="4" cy="-4" r="4" fill="#a855f7" fill-opacity="0.5"/>
    <text x="14" y="0" fill="#baa9d4">Fork</text>
    <text x="62" y="0" fill="#c9a9ff" fill-opacity="0.5">/</text>
    <text x="76" y="0" fill="#baa9d4">Apache-2.0</text>
    <text x="172" y="0" fill="#c9a9ff" fill-opacity="0.5">/</text>
    <text x="186" y="0" fill="#baa9d4">Upstream</text>
    <rect x="268" y="-13" width="94" height="20" rx="2" fill="#a855f7" fill-opacity="0.12"
          stroke="#a855f7" stroke-opacity="0.0"/>
    <text x="315" y="1" text-anchor="middle" fill="#c9a9ff" fill-opacity="0.7" font-size="9">ARCHIVED</text>
  </g>

  <g clip-path="url(#band)">
    <g fill="#a855f7" fill-opacity="0.17">
      <path d="M-24 268 L22 248 H42 L-4 268 Z"/><path d="M46 268 L92 248 H112 L66 268 Z"/>
      <path d="M116 268 L162 248 H182 L136 268 Z"/><path d="M186 268 L232 248 H252 L206 268 Z"/>
      <path d="M256 268 L302 248 H322 L276 268 Z"/><path d="M326 268 L372 248 H392 L346 268 Z"/>
      <path d="M396 268 L442 248 H462 L416 268 Z"/><path d="M466 268 L512 248 H532 L486 268 Z"/>
      <path d="M536 268 L582 248 H602 L556 268 Z"/>
    </g>
  </g>

  <path d="M0 248h600" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="1" y="1" width="598" height="266" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5"/>
  <g stroke="#a855f7" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M12 34 L12 12 L34 12"/>
    <path d="M588 34 L588 12 L566 12"/>
  </g>
</svg>
