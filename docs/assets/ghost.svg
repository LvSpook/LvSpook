<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LvSpook ghost">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#ffc9d1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33121b"/>
      <stop offset="55%" stop-color="#17090d"/>
      <stop offset="100%" stop-color="#0d0407"/>
    </linearGradient>
    <clipPath id="hatClip">
      <path d="M34 -30 Q34 -32 36 -32 H64 Q66 -32 66 -30 L64.5 6 H35.5 Z"/>
    </clipPath>
    <filter id="tiny" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- transparent, and centred in the viewBox so nav and tab both sit straight -->
  <g transform="translate(8 16.16) scale(0.48)">
    <path d="M10 90 L10 55 C10 28 28 12 50 12 C72 12 90 28 90 55 L90 90
             C90 96 84 98 80 93 C76 88 70 88 66 93 C62 98 56 98 52 93
             C48 88 42 88 38 93 C34 98 28 98 24 93 C20 88 14 88 10 90 Z"
          fill="url(#body)"/>
    <ellipse cx="36" cy="52" rx="5.5" ry="6.5" fill="#12060a"/>
    <ellipse cx="64" cy="52" rx="5.5" ry="6.5" fill="#12060a"/>
    <ellipse cx="36" cy="51" rx="2.4" ry="2.8" fill="#ff1f3d" filter="url(#tiny)"/>
    <ellipse cx="64" cy="51" rx="2.4" ry="2.8" fill="#ff1f3d" filter="url(#tiny)"/>
    <path d="M42 72 Q50 79 58 72" fill="none" stroke="#12060a" stroke-opacity="0.6"
          stroke-width="3.4" stroke-linecap="round"/>

    <!-- top hat -->
    <g>
      <path d="M34 -30 Q34 -32 36 -32 H64 Q66 -32 66 -30 L64.5 6 H35.5 Z"
            fill="url(#hat)" stroke="#ff1f3d" stroke-opacity="0.55" stroke-width="2"/>
      <g clip-path="url(#hatClip)">
        <rect x="28" y="-9" width="44" height="9" fill="#ff1f3d"/>
      </g>
      <ellipse cx="50" cy="11" rx="31" ry="5" fill="url(#hat)"
               stroke="#ff1f3d" stroke-opacity="0.55" stroke-width="2"/>
    </g>
  </g>
</svg>
