<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="LvSpook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdfbfb"/>
      <stop offset="100%" stop-color="#fdf4f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e11d2e" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#e11d2e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="70%" stop-color="#2a1013"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d2e" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#e11d2e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e11d2e" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#c1121f" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="bottomStrip">
      <rect x="0" y="282" width="1200" height="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#scan)"/>

  <!-- structural grid -->
  <g stroke="#c1121f" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 75h1200M0 150h1200M0 225h1200"/>
    <path d="M300 0v300M600 0v300M900 0v300"/>
  </g>

  <!-- ruler ticks -->
  <g stroke="#c1121f" stroke-opacity="0.32" stroke-width="1">
    <path d="M40 0v7M70 0v4M100 0v4M130 0v4M160 0v7M190 0v4M220 0v4M250 0v4M280 0v7M310 0v4M340 0v4M370 0v4M400 0v7M430 0v4M460 0v4M490 0v4M520 0v7M550 0v4M580 0v4M610 0v4M640 0v7M670 0v4M700 0v4M730 0v4M760 0v7M790 0v4M820 0v4M850 0v4M880 0v7M910 0v4M940 0v4M970 0v4M1000 0v7M1030 0v4M1060 0v4M1090 0v4M1120 0v7M1150 0v4"/>
  </g>
  <text x="40" y="24" font-family="Consolas, 'Cascadia Mono', monospace" font-size="9"
        fill="#c1121f" fill-opacity="0.6" letter-spacing="2">SPECTRAL // SYS.01</text>
  <text x="1160" y="24" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" font-size="9"
        fill="#c1121f" fill-opacity="0.6" letter-spacing="2">SIGNAL: ACTIVE</text>

  <!-- emblem -->
  <g transform="translate(180 152)">
    <ellipse cx="0" cy="4" rx="86" ry="86" fill="#e11d2e" fill-opacity="0.16" filter="url(#bloom)"/>
    <path d="M0 -92 L80 -46 L80 46 L0 92 L-80 46 L-80 -46 Z"
          fill="#fffafa" stroke="#c1121f" stroke-opacity="0.75" stroke-width="1.6"/>
    <path d="M0 -74 L64 -37 L64 37 L0 74 L-64 37 L-64 -37 Z"
          fill="none" stroke="#c1121f" stroke-opacity="0.22" stroke-width="1"/>
    <g fill="#c1121f">
      <path d="M-46 2 L-14 -13 L-8 0 L-40 15 Z"/>
      <path d="M46 2 L14 -13 L8 0 L40 15 Z"/>
    </g>
    <g fill="#ff8494">
      <path d="M-42 1 L-19 -9 L-16 -2 L-38 8 Z"/>
      <path d="M42 1 L19 -9 L16 -2 L38 8 Z"/>
    </g>
    <path d="M-18 40 L18 40" stroke="#c1121f" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-11 49 L11 49" stroke="#c1121f" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M0 -92 L0 -70 L-6 -58 L6 -46" fill="none" stroke="#c1121f" stroke-opacity="0.5" stroke-width="1.4"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(330 0)"
     font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
     font-size="84" font-weight="900" letter-spacing="1">
    <text x="-3" y="152" fill="#e11d2e" fill-opacity="0.20">LVSPOOK</text>
    <text x="0" y="150" fill="url(#headline)">LVSPOOK</text>
  </g>

  <text x="333" y="184"
        font-family="Consolas, 'Cascadia Mono', monospace"
        font-size="13" fill="#8c3a42" letter-spacing="4.5">WINDOWS DESKTOP TOOLS // RUST</text>

  <g transform="translate(333 210)"
     font-family="Consolas, 'Cascadia Mono', monospace" font-size="10.5" letter-spacing="1.6">
    <rect x="0" y="-14" width="74" height="26" rx="3" fill="#c1121f" fill-opacity="0.07" stroke="#c1121f" stroke-opacity="0.45"/>
    <text x="37" y="3" text-anchor="middle" fill="#a11322">RUST</text>
    <rect x="84" y="-14" width="98" height="26" rx="3" fill="#c1121f" fill-opacity="0.07" stroke="#c1121f" stroke-opacity="0.45"/>
    <text x="133" y="3" text-anchor="middle" fill="#a11322">WINDOWS</text>
    <rect x="192" y="-14" width="128" height="26" rx="3" fill="#ffffff" stroke="#c1121f" stroke-opacity="0.28"/>
    <text x="256" y="3" text-anchor="middle" fill="#8c3a42">BUILD: WIP</text>
  </g>

  <g stroke="#c1121f" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M16 44 L16 16 L44 16"/>
    <path d="M1184 44 L1184 16 L1156 16"/>
    <path d="M16 254 L16 282 L44 282"/>
    <path d="M1184 254 L1184 282 L1156 282"/>
  </g>

  <g clip-path="url(#bottomStrip)">
    <g fill="#c1121f" fill-opacity="0.13">
      <path d="M-40 300 L48 282 H84 L-4 300 Z"/>
      <path d="M92 300 L180 282 H216 L128 300 Z"/>
      <path d="M224 300 L312 282 H348 L260 300 Z"/>
      <path d="M356 300 L444 282 H480 L392 300 Z"/>
      <path d="M488 300 L576 282 H612 L524 300 Z"/>
      <path d="M620 300 L708 282 H744 L656 300 Z"/>
      <path d="M752 300 L840 282 H876 L788 300 Z"/>
      <path d="M884 300 L972 282 H1008 L920 300 Z"/>
      <path d="M1016 300 L1104 282 H1140 L1052 300 Z"/>
      <path d="M1148 300 L1236 282 H1200 L1120 300 Z"/>
    </g>
  </g>

  <path d="M0 282h1200" stroke="url(#ruleFade)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="298" rx="2" fill="none" stroke="#c1121f" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
